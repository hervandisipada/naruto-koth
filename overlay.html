<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KotH Live Overlay</title>
  <!-- MQTT.js for Realtime Cloud Sync on GitHub Pages -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      /* User's Exact 4-Color Palette: #F7F7F7, #EEEEEE, #393E46, #929AAB */
      --c-white: #F7F7F7;
      --c-light: #EEEEEE;
      --c-dark: #393E46;
      --c-slate: #929AAB;

      --bg-dark: rgba(57, 62, 70, 0.96);
      --border-subtle: #929AAB;
      --accent-gold: #F7F7F7;
      --accent-blue: #929AAB;
      --accent-green: #EEEEEE;
      --accent-red: #929AAB;
      --accent-purple: #929AAB;
      --text-main: #F7F7F7;
      --text-muted: #EEEEEE;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Consolas', 'Courier New', Courier, monospace;
    }

    button,
    input,
    select,
    textarea {
      font-family: 'Consolas', 'Courier New', Courier, monospace;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 6px;
      box-sizing: border-box;
      background-color: transparent;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
      font-family: 'Consolas', 'Courier New', Courier, monospace;
    }

    /* RESPONSIVE & SAFE FIT STREAM OVERLAY (MAX 400x720) */
    .mobile-frame {
      width: 100%;
      height: 100%;
      max-width: 400px;
      max-height: 720px;
      background: var(--bg-dark);
      border-radius: 12px;
      padding: 8px;
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* ANNOUNCEMENT TICKER */
    .overlay-ticker {
      background: rgba(0, 0, 0, 0.45);
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 6px;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      border-left: 4px solid #ffffff;
      color: #ffffff;
      overflow: hidden;
      flex-shrink: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      border-right: 1px solid rgba(255, 255, 255, 0.2);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .ticker-label {
      color: #ffffff;
      font-weight: 900;
      font-size: 1rem;
      letter-spacing: 0.8px;
      white-space: nowrap;
    }

    .ticker-content {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.98rem;
      flex: 1;
    }

    /* TOP WS BANNER */
    .overlay-top-record {
      background: rgba(0, 0, 0, 0.45);
      border-radius: 8px;
      padding: 5px 10px;
      margin-bottom: 6px;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      gap: 8px;
      border-left: 4px solid #ffffff;
      color: #ffffff;
      overflow: hidden;
      flex-shrink: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      border-right: 1px solid rgba(255, 255, 255, 0.2);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .record-label {
      color: #ffffff;
      font-weight: 900;
      font-size: 0.88rem;
      letter-spacing: 0.8px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .record-marquee-wrap {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      min-width: 0;
      display: flex;
      align-items: center;
    }

    .record-content {
      color: #ffffff;
      font-weight: 700;
      font-size: 0.92rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      will-change: transform;
    }

    .rec-username {
      font-weight: 800;
      color: #ffffff;
    }

    .rec-char {
      font-weight: 600;
      color: #ffffff;
    }

    .rec-ws {
      font-weight: 900;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 1px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .rec-sep {
      color: #ffffff;
      opacity: 0.8;
      font-weight: 800;
      margin: 0 1px;
    }

    /* MATCH ARENA (1 VS 1) - COMPACT & HIGH CONTRAST */
    .match-box {
      display: flex;
      flex-direction: column;
      gap: 3px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      padding: 5px;
      border: 1px solid var(--border-subtle);
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .player-slot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      border-radius: 6px;
      transition: background 0.15s ease;
      background: rgba(255, 255, 255, 0.03);
      border-left: 3px solid var(--c-slate);
    }

    .player-slot.vvip {
      background: rgba(168, 85, 247, 0.08);
      border-left: 3px solid #C084FC;
    }

    .player-slot.vip {
      background: rgba(255, 215, 0, 0.05);
      border-left: 3px solid #FFD700;
    }

    .player-slot.free {
      background: rgba(255, 255, 255, 0.02);
      border-left: 3px solid rgba(146, 154, 171, 0.35);
    }

    /* P2 MIRRORED BORDER & LAYOUT */
    #slot-p2 {
      border-left: none;
      border-right: 3px solid var(--c-slate);
    }
    #slot-p2.vvip {
      border-left: none;
      border-right: 3px solid #C084FC;
    }
    #slot-p2.vip {
      border-left: none;
      border-right: 3px solid #FFD700;
    }
    #slot-p2.free {
      border-left: none;
      border-right: 3px solid rgba(146, 154, 171, 0.35);
    }

    /* ROLE BADGE = TIER BADGE IN ARENA */
    .p-role-tag {
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 3px 7px;
      border-radius: 3px;
      display: inline-block;
      margin-bottom: 2px;
      letter-spacing: 0.5px;
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    .p-role-tag.vvip {
      background-color: rgba(168, 85, 247, 0.22);
      border: 1px solid #C084FC;
      color: #C084FC;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-shadow: 0 0 6px rgba(192, 132, 252, 0.4);
    }

    .p-role-tag.vip {
      background-color: rgba(255, 215, 0, 0.16);
      border: 1px solid #FFD700;
      color: #FFD700;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-shadow: 0 0 6px rgba(255, 215, 0, 0.35);
    }

    .p-role-tag.free {
      background-color: transparent;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      font-weight: 700;
    }

    /* LARGE PLAYER NAME */
    .p-name {
      font-weight: 800;
      font-size: 1.3rem;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 195px;
      line-height: 1.2;
    }

    /* LARGE CHARACTER NAME */
    .p-char {
      font-size: 0.92rem;
      color: #ffffff;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 195px;
      margin-top: 1px;
    }

    .p-right {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      flex-shrink: 0;
    }

    /* PROMINENT WIN STREAK */
    .p-ws {
      font-weight: 800;
      font-size: 1.15rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .free-streak {
      font-size: 0.72rem;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .bonus-badge {
      font-size: 0.72rem;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .p-ticket {
      font-size: 0.92rem;
      color: #ffffff;
      font-weight: 600;
    }

    .p-ticket b {
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 800;
    }

    .vs-tag {
      text-align: center;
      font-size: 0.74rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 1px;
      margin: 1px 0;
    }

    /* SCROLLABLE QUEUE SECTION */
    .queue-section {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      padding: 6px 8px;
      border: 1px solid rgba(146, 154, 171, 0.25);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .queue-title {
      font-size: 0.82rem;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(146, 154, 171, 0.25);
      padding-bottom: 3px;
    }

    /* SCROLLABLE LIST */
    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
      flex: 1;
      padding-right: 2px;
      scroll-behavior: smooth;
    }

    .queue-list::-webkit-scrollbar {
      width: 4px;
    }

    .queue-list::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 2px;
    }

    .queue-list::-webkit-scrollbar-thumb {
      background: var(--c-slate);
      border-radius: 2px;
    }

    /* VERTICAL TIER SECTIONS */
    .tier-section {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 5px;
    }

    .tier-section.vvip {
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px dashed rgba(192, 132, 252, 0.45);
    }

    .tier-section.vip {
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px dashed rgba(255, 215, 0, 0.45);
    }

    .tier-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #ffffff;
    }

    .th-ticket {
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ffffff;
      margin-right: 2px;
      min-width: 32px;
      text-align: center;
    }

    .tier-header.vvip {
      background: rgba(168, 85, 247, 0.16);
      color: #C084FC;
      border-left: 3px solid #C084FC;
    }

    .tier-header.vvip span:first-child,
    .tier-header.vvip .th-title {
      color: #C084FC;
      font-weight: 900;
    }

    .tier-header.vip {
      background: rgba(255, 215, 0, 0.14);
      color: #FFD700;
      border-left: 3px solid #FFD700;
    }

    .tier-header.vip span:first-child,
    .tier-header.vip .th-title {
      color: #FFD700;
      font-weight: 900;
    }

    .tier-header.free {
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      border-left: 3px solid rgba(255, 255, 255, 0.4);
      font-weight: 700;
    }

    .tier-status-tag {
      font-size: 0.68rem;
      font-weight: 900;
      padding: 1px 6px;
      border-radius: 3px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: inline-block;
      vertical-align: middle;
      color: #ffffff;
    }

    .tier-status-tag.open {
      background: rgba(34, 197, 94, 0.35);
      border: 1px solid #22c55e;
    }

    .tier-status-tag.closed {
      background: rgba(239, 68, 68, 0.35);
      border: 1px solid #ef4444;
    }

    .tier-empty {
      font-size: 0.72rem;
      color: #ffffff;
      opacity: 0.85;
      padding: 3px 8px;
      font-style: italic;
    }

    /* CLEAN QUEUE ROW WITH TICKET DISPLAY */
    .queue-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 7px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      border-left: 3px solid var(--c-slate);
      flex-shrink: 0;
    }

    .queue-row.vvip {
      border-left-color: #C084FC;
      background: rgba(168, 85, 247, 0.06);
    }

    .queue-row.vip {
      border-left-color: #FFD700;
      background: rgba(255, 215, 0, 0.05);
    }

    .queue-row.free {
      border-left-color: rgba(146, 154, 171, 0.35);
      background: rgba(255, 255, 255, 0.02);
    }

    .queue-row.saved {
      border-left-color: var(--c-light);
      background: rgba(255, 255, 255, 0.03);
    }

    /* HORIZONTAL SCROLL / MARQUEE FOR LONG NAMES */
    .q-left {
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      flex: 1;
      min-width: 0;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .q-left::-webkit-scrollbar {
      display: none;
    }

    .q-text-wrap {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      will-change: transform;
    }

    .q-sep {
      color: #ffffff;
      font-weight: 800;
      opacity: 0.8;
      margin: 0 1px;
    }

    @keyframes marqueeH {

      0%,
      20% {
        transform: translateX(0);
      }

      80%,
      100% {
        transform: translateX(var(--marquee-dist, -50px));
      }
    }

    .marquee-active {
      animation: marqueeH 7s ease-in-out infinite alternate;
    }

    .q-idx {
      font-weight: 800;
      color: #ffffff;
      font-size: 0.95rem;
      min-width: 20px;
    }

    .queue-row.vvip .q-idx {
      color: #C084FC;
      font-weight: 900;
    }

    .queue-row.vip .q-idx {
      color: #FFD700;
      font-weight: 900;
    }

    .q-name {
      font-weight: 800;
      color: #ffffff;
      font-size: 1.05rem;
    }

    .q-char {
      font-size: 0.92rem;
      color: #ffffff;
      font-weight: 600;
    }

    .q-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      margin-left: 8px;
    }

    /* USER TICKET DISPLAY IN QUEUE */
    .q-ticket {
      font-size: 0.92rem;
      font-weight: 900;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 2px 7px;
      border-radius: 4px;
      white-space: nowrap;
      min-width: 28px;
      text-align: center;
    }

    .q-badge {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 3px;
      letter-spacing: 0.5px;
      flex-shrink: 0;
      color: #ffffff;
    }

    .q-badge.vvip {
      background-color: rgba(168, 85, 247, 0.22);
      border: 1px solid #C084FC;
      color: #C084FC;
      font-weight: 900;
      letter-spacing: 0.8px;
    }

    .q-badge.vip {
      background-color: rgba(255, 215, 0, 0.16);
      border: 1px solid #FFD700;
      color: #FFD700;
      font-weight: 900;
      letter-spacing: 0.8px;
    }

    .q-badge.free {
      background-color: transparent;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      font-weight: 700;
    }

    .q-badge.saved {
      background-color: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.5);
      color: #ffffff;
      font-weight: 800;
    }

    .empty-queue {
      color: #ffffff;
      font-size: 0.85rem;
      text-align: center;
      padding: 24px 0;
    }

    .scroll-hint {
      font-size: 0.68rem;
      color: #ffffff;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <div class="mobile-frame">
    <!-- Announcement Ticker -->
    <div id="overlay-ticker" class="overlay-ticker" style="display:none;">
      <span class="ticker-label">NOTE:</span>
      <span id="ticker-text" class="ticker-content"></span>
    </div>

    <!-- Top Record WS Banner -->
    <div id="overlay-top-record" class="overlay-top-record">
      <span class="record-label">TOP WS:</span>
      <div class="record-marquee-wrap">
        <span id="record-text" class="record-content">
          <span id="rec-username" class="rec-username">-</span>
          <span class="rec-sep">|</span>
          <span id="rec-char" class="rec-char">-</span>
          <span class="rec-sep">|</span>
          <span id="rec-ws" class="rec-ws">0 WS</span>
        </span>
      </div>
    </div>

    <!-- Match Arena (1 VS 1) -->
    <div class="match-box">
      <!-- Player 1 Slot -->
      <div class="player-slot" id="slot-p1">
        <div>
          <span class="p-role-tag" id="p1-role-tag">P1</span>
          <div id="p1-name" class="p-name">Menunggu...</div>
          <div id="p1-char" class="p-char">-</div>
        </div>
        <div class="p-right">
          <div class="p-ws">
            WS: <span id="p1-ws">0</span>
            <span id="p1-bonus" class="bonus-badge" style="display:none;">+1 TIKET</span>
          </div>
          <div class="p-ticket">Tiket: <b id="p1-tickets">0</b></div>
        </div>
      </div>

      <div class="vs-tag">VS</div>

      <!-- Player 2 Slot (Mirrored: WS/Tiket on Left, Tier/Nama/Char on Right) -->
      <div class="player-slot" id="slot-p2">
        <div class="p-left-p2" style="display: flex; flex-direction: column; align-items: flex-start; gap: 3px; flex-shrink: 0;">
          <div class="p-ws">
            WS: <span id="p2-ws">0</span>
            <span id="p2-bonus" class="bonus-badge" style="display:none;">+1 TIKET</span>
          </div>
          <div class="p-ticket">Tiket: <b id="p2-tickets">0</b></div>
        </div>
        <div class="p-right-p2" style="display: flex; flex-direction: column; align-items: flex-end; text-align: right; min-width: 0; flex: 1;">
          <span class="p-role-tag" id="p2-role-tag">P2</span>
          <div id="p2-name" class="p-name" style="text-align: right;">Menunggu...</div>
          <div id="p2-char" class="p-char" style="text-align: right;">-</div>
        </div>
      </div>
    </div>

    <!-- Scrollable Queue Section -->
    <div class="queue-section">
      <div class="queue-title">
        <span id="queue-section-title">ANTREAN BERIKUTNYA</span>
        <div style="display:flex; align-items:center; gap:6px;">
          <span id="queue-total-count" style="color:#ffffff; font-weight:800; font-size:0.85rem;">0 Pemain</span>
        </div>
      </div>

      <!-- ALL QUEUE OR SAVED ITEMS RENDERED HERE WITH TICKETS -->
      <div id="queue-list" class="queue-list">
        <div class="empty-queue">(Antrean Kosong)</div>
      </div>
    </div>
  </div>

  <script>
    let state = {
      p1: null,
      p2: null,
      queue: [],
      saved: [],
      announcement: '',
      topRecord: { name: '-', char: '-', ws: 0 },
      overlayListMode: 'queue',
      tierStatus: { VVIP: 'OPEN', VIP: 'OPEN', FREE: 'OPEN' }
    };

    // Helper deteksi peran King vs Penantang
    function getArenaRoles(st) {
      const s = st || state;
      if (s.p2 && (s.p2.ws > 0 || !s.p1)) {
        if (!s.p1 || (s.p1.ws === 0 && s.p2.ws > 0)) {
          return { kingSlot: 'p2', challengerSlot: 'p1' };
        }
      }
      return { kingSlot: 'p1', challengerSlot: 'p2' };
    }

    function formatChar(char) {
      if (!char) return '-';
      const c = String(char).trim();
      if (!c || c === 'TBA' || c === 'Belum Pilih' || c === 'Belum Pilih / TBA' || c.toLowerCase() === 'tba') {
        return '-';
      }
      return c;
    }

    function render(data) {
      if (!data) return;
      state = data;

      // Announcement Ticker
      const tickerEl = document.getElementById('overlay-ticker');
      const tickerText = document.getElementById('ticker-text');
      if (state.announcement && state.announcement.trim()) {
        tickerText.innerText = state.announcement.trim();
        tickerEl.style.display = 'flex';
      } else {
        tickerEl.style.display = 'none';
      }

      // Top Record WS Banner (Auto-Resolved to Highest WS)
      const recordEl = document.getElementById('overlay-top-record');
      const recUser = document.getElementById('rec-username');
      const recChar = document.getElementById('rec-char');
      const recWs = document.getElementById('rec-ws');
      const recWrap = document.querySelector('.record-marquee-wrap');
      const recContent = document.getElementById('record-text');

      const topRec = (state.topRecord && typeof state.topRecord === 'object') ? state.topRecord : { name: '-', char: '-', ws: 0 };

      if (recUser) recUser.innerText = topRec.name || '-';
      if (recChar) recChar.innerText = formatChar(topRec.char);
      const wsCount = (topRec.ws !== undefined && topRec.ws !== null) ? topRec.ws : 0;
      if (recWs) recWs.innerText = `${wsCount} WS`;

      if (recWrap && recContent) {
        recContent.classList.remove('marquee-active');
        recContent.style.removeProperty('--marquee-dist');
        requestAnimationFrame(() => {
          if (recContent.scrollWidth > recWrap.clientWidth) {
            const diff = recContent.scrollWidth - recWrap.clientWidth;
            recContent.style.setProperty('--marquee-dist', `-${diff + 12}px`);
            recContent.classList.add('marquee-active');
          }
        });
      }

      // Slot 1 (P1) - Menggunakan Label Tier (Bukan King/Penantang)
      const slot1 = document.getElementById('slot-p1');
      const p1RoleTag = document.getElementById('p1-role-tag');
      const p1Name = document.getElementById('p1-name');
      const p1Char = document.getElementById('p1-char');
      const p1Ws = document.getElementById('p1-ws');
      const p1Tickets = document.getElementById('p1-tickets');
      const p1Bonus = document.getElementById('p1-bonus');

      if (state.p1) {
        const t1 = (state.p1.type === 'VVIP' || state.p1.type === 'VIP') ? state.p1.type : 'FREE';
        slot1.className = 'player-slot ' + t1.toLowerCase();
        p1RoleTag.className = 'p-role-tag ' + t1.toLowerCase();
        p1RoleTag.innerText = (t1 === 'VVIP') ? '⭐ VVIP' : t1;

        p1Name.innerText = state.p1.name;
        p1Char.innerText = formatChar(state.p1.char);
        p1Ws.innerText = state.p1.ws || 0;

        // Tiket: 1+1 lalu 5 detik otomatis terjumlah jadi 2
        let p1TicketText = state.p1.matchesLeft;
        if (state.p1.bonusAnimUntil && Date.now() < state.p1.bonusAnimUntil) {
          p1TicketText = `${state.p1.bonusBase}+1`;
          const msLeft = state.p1.bonusAnimUntil - Date.now();
          setTimeout(() => render(state), msLeft + 50);
        }
        p1Tickets.innerText = p1TicketText;

        if (p1Bonus) {
          if (state.p1.bonusAnimUntil && Date.now() < state.p1.bonusAnimUntil) {
            p1Bonus.innerText = '+1 TIKET';
            p1Bonus.style.display = 'inline-block';
          } else {
            p1Bonus.style.display = 'none';
          }
        }
      } else {
        slot1.className = 'player-slot';
        p1RoleTag.className = 'p-role-tag';
        p1RoleTag.innerText = 'P1';

        p1Name.innerText = "Menunggu...";
        p1Char.innerText = "-";
        p1Ws.innerText = "0";
        p1Tickets.innerText = "-";
        if (p1Bonus) p1Bonus.style.display = 'none';
      }

      // Slot 2 (P2) - Menggunakan Label Tier (Bukan King/Penantang)
      const slot2 = document.getElementById('slot-p2');
      const p2RoleTag = document.getElementById('p2-role-tag');
      const p2Name = document.getElementById('p2-name');
      const p2Char = document.getElementById('p2-char');
      const p2Ws = document.getElementById('p2-ws');
      const p2Tickets = document.getElementById('p2-tickets');
      const p2Bonus = document.getElementById('p2-bonus');

      if (state.p2) {
        const t2 = (state.p2.type === 'VVIP' || state.p2.type === 'VIP') ? state.p2.type : 'FREE';
        slot2.className = 'player-slot ' + t2.toLowerCase();
        p2RoleTag.className = 'p-role-tag ' + t2.toLowerCase();
        p2RoleTag.innerText = (t2 === 'VVIP') ? '⭐ VVIP' : t2;

        p2Name.innerText = state.p2.name;
        p2Char.innerText = formatChar(state.p2.char);
        p2Ws.innerText = state.p2.ws || 0;

        // Tiket: 1+1 lalu 5 detik otomatis terjumlah jadi 2
        let p2TicketText = state.p2.matchesLeft;
        if (state.p2.bonusAnimUntil && Date.now() < state.p2.bonusAnimUntil) {
          p2TicketText = `${state.p2.bonusBase}+1`;
          const msLeft = state.p2.bonusAnimUntil - Date.now();
          setTimeout(() => render(state), msLeft + 50);
        }
        p2Tickets.innerText = p2TicketText;

        if (p2Bonus) {
          if (state.p2.bonusAnimUntil && Date.now() < state.p2.bonusAnimUntil) {
            p2Bonus.innerText = '+1 TIKET';
            p2Bonus.style.display = 'inline-block';
          } else {
            p2Bonus.style.display = 'none';
          }
        }
      } else {
        slot2.className = 'player-slot';
        p2RoleTag.className = 'p-role-tag';
        p2RoleTag.innerText = 'P2';

        p2Name.innerText = "Menunggu...";
        p2Char.innerText = "-";
        p2Ws.innerText = "0";
        p2Tickets.innerText = "-";
        if (p2Bonus) p2Bonus.style.display = 'none';
      }

      // Render Queue or Saved list with Ticket Count & 3 Vertical Tiers (VVIP, VIP, FREE)
      const isSavedMode = (state.overlayListMode === 'saved');
      const qSectionTitle = document.getElementById('queue-section-title');
      const qContainer = document.getElementById('queue-list');
      const qTotal = document.getElementById('queue-total-count');

      const tierRank = { 'VVIP': 1, 'VIP': 2, 'FREE': 3 };
      const tiers = [
        { key: 'VVIP', label: '⭐ VVIP', cls: 'vvip' },
        { key: 'VIP', label: 'VIP', cls: 'vip' },
        { key: 'FREE', label: 'FREE', cls: 'free' }
      ];

      if (isSavedMode) {
        if (qSectionTitle) qSectionTitle.innerText = 'DAFTAR SAVED';
        const sList = (state.saved || []).slice();
        sList.sort((a, b) => {
          const rankA = tierRank[a.type] || 3;
          const rankB = tierRank[b.type] || 3;
          if (rankA !== rankB) return rankA - rankB;
          return 0;
        });

        qTotal.innerText = `${sList.length} Pemain`;

        if (sList.length === 0) {
          qContainer.innerHTML = '<div class="empty-queue">(Saved Kosong)</div>';
        } else {
          qContainer.innerHTML = '';
          let globalSavedIdx = 0;
          tiers.forEach(tier => {
            const players = sList.filter(p => ((p.type === 'VVIP' || p.type === 'VIP') ? p.type : 'FREE') === tier.key);

            const tStatus = (state.tierStatus && state.tierStatus[tier.key]) || 'OPEN';
            const statusClass = tStatus.toLowerCase() === 'closed' ? 'closed' : 'open';

            const tierDiv = document.createElement('div');
            tierDiv.className = `tier-section ${tier.cls}`;
            tierDiv.innerHTML = `
              <div class="tier-header ${tier.cls}">
                <div style="display:flex; align-items:center; gap:6px;">
                  <span>${tier.label}</span>
                  <span class="tier-status-tag ${statusClass}">${tStatus}</span>
                  <span>(${players.length})</span>
                </div>
                <span class="th-ticket">TIKET</span>
              </div>
            `;

            if (players.length === 0) {
              const emptyDiv = document.createElement('div');
              emptyDiv.className = 'tier-empty';
              emptyDiv.innerText = '(Kosong)';
              tierDiv.appendChild(emptyDiv);
            } else {
              players.forEach(p => {
                globalSavedIdx++;
                const row = document.createElement('div');
                row.className = `queue-row ${tier.cls}`;
                row.innerHTML = `
                  <div class="q-left">
                    <div class="q-text-wrap">
                      <span class="q-idx">#${globalSavedIdx}</span>
                      <span class="q-name">${escapeHtml(p.name)}</span>
                      <span class="q-sep">|</span>
                      <span class="q-char">${escapeHtml(formatChar(p.char))}</span>
                    </div>
                  </div>
                  <div class="q-right">
                    <span class="q-badge ${tier.cls}">${p.type || 'FREE'}</span>
                    <span class="q-ticket">${p.matchesLeft}</span>
                  </div>
                `;
                tierDiv.appendChild(row);
              });
            }

            qContainer.appendChild(tierDiv);
          });

          // Horizontal scroll animation jika teks panjang
          document.querySelectorAll('.q-left').forEach(el => {
            const wrap = el.querySelector('.q-text-wrap');
            if (wrap && el.scrollWidth > el.clientWidth) {
              const diff = el.scrollWidth - el.clientWidth;
              wrap.style.setProperty('--marquee-dist', `-${diff + 14}px`);
              wrap.classList.add('marquee-active');
            }
          });

          startSmartAutoScroll();
        }
      } else {
        if (qSectionTitle) qSectionTitle.innerText = 'ANTREAN LIVE';
        const qList = (state.queue || []).slice();
        qList.sort((a, b) => {
          const rankA = tierRank[a.type] || 3;
          const rankB = tierRank[b.type] || 3;
          if (rankA !== rankB) return rankA - rankB;
          return 0;
        });

        qTotal.innerText = `${qList.length} Pemain`;

        if (qList.length === 0) {
          qContainer.innerHTML = '<div class="empty-queue">(Antrean Kosong)</div>';
        } else {
          qContainer.innerHTML = '';
          tiers.forEach(tier => {
            const players = [];
            qList.forEach((p, idx) => {
              const pTier = (p.type === 'VVIP' || p.type === 'VIP') ? p.type : 'FREE';
              if (pTier === tier.key) {
                players.push({ player: p, globalIdx: idx + 1 });
              }
            });

            const tStatus = (state.tierStatus && state.tierStatus[tier.key]) || 'OPEN';
            const statusClass = tStatus.toLowerCase() === 'closed' ? 'closed' : 'open';

            const tierDiv = document.createElement('div');
            tierDiv.className = `tier-section ${tier.cls}`;
            tierDiv.innerHTML = `
              <div class="tier-header ${tier.cls}">
                <div style="display:flex; align-items:center; gap:6px;">
                  <span>${tier.label}</span>
                  <span class="tier-status-tag ${statusClass}">${tStatus}</span>
                  <span>(${players.length})</span>
                </div>
                <span class="th-ticket">TIKET</span>
              </div>
            `;

            if (players.length === 0) {
              const emptyDiv = document.createElement('div');
              emptyDiv.className = 'tier-empty';
              emptyDiv.innerText = '(Kosong)';
              tierDiv.appendChild(emptyDiv);
            } else {
              players.forEach(({ player: p, globalIdx }) => {
                const row = document.createElement('div');
                row.className = `queue-row ${tier.cls}`;
                row.innerHTML = `
                  <div class="q-left">
                    <div class="q-text-wrap">
                      <span class="q-idx">#${globalIdx}</span>
                      <span class="q-name">${escapeHtml(p.name)}</span>
                      <span class="q-sep">|</span>
                      <span class="q-char">${escapeHtml(formatChar(p.char))}</span>
                    </div>
                  </div>
                  <div class="q-right">
                    <span class="q-badge ${tier.cls}">${p.type || 'FREE'}</span>
                    <span class="q-ticket">${p.matchesLeft}</span>
                  </div>
                `;
                tierDiv.appendChild(row);
              });
            }

            qContainer.appendChild(tierDiv);
          });

          // Horizontal scroll animation jika teks panjang
          document.querySelectorAll('.q-left').forEach(el => {
            const wrap = el.querySelector('.q-text-wrap');
            if (wrap && el.scrollWidth > el.clientWidth) {
              const diff = el.scrollWidth - el.clientWidth;
              wrap.style.setProperty('--marquee-dist', `-${diff + 14}px`);
              wrap.classList.add('marquee-active');
            }
          });

          startSmartAutoScroll();
        }
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Auto-Scroll: Scroll ke bawah -> Berhenti 3 dtk -> Langsung JUMP kembali ke paling atas
    let autoScrollTimer = null;
    let isUserInteracting = false;

    function startSmartAutoScroll() {
      const container = document.getElementById('queue-list');
      if (!container) return;

      clearInterval(autoScrollTimer);

      let stateMode = 'scrolling'; // 'scrolling', 'paused_at_bottom', 'paused_at_top'
      let pauseTicks = 40; // 2 detik awal di posisi atas

      autoScrollTimer = setInterval(() => {
        if (isUserInteracting) return;
        const maxScroll = container.scrollHeight - container.clientHeight;
        if (maxScroll <= 8) return;

        if (pauseTicks > 0) {
          pauseTicks--;
          if (pauseTicks === 0) {
            if (stateMode === 'paused_at_bottom') {
              // LANGSUNG JUMP KE ATAS! BUKAN SCROLL KE ATAS!
              container.scrollTop = 0;
              stateMode = 'paused_at_top';
              pauseTicks = 40; // Berhenti 2 detik di paling atas
            } else if (stateMode === 'paused_at_top') {
              stateMode = 'scrolling';
            }
          }
          return;
        }

        if (stateMode === 'scrolling') {
          container.scrollTop += 1;
          if (container.scrollTop >= maxScroll - 2) {
            stateMode = 'paused_at_bottom';
            pauseTicks = 60; // Berhenti 3 detik di bawah (60 * 50ms = 3000ms = 3 detik)
          }
        }
      }, 50);

      container.onmouseenter = () => { isUserInteracting = true; };
      container.onmouseleave = () => { isUserInteracting = false; };
      container.ontouchstart = () => { isUserInteracting = true; };
      container.ontouchend = () => { setTimeout(() => { isUserInteracting = false; }, 2000); };
    }

    // Connect Local SSE
    function connectSSE() {
      if (window.location.protocol.startsWith('http')) {
        const evtSource = new EventSource('/api/events');
        evtSource.onmessage = function (e) {
          try {
            render(JSON.parse(e.data));
          } catch (err) { }
        };
        evtSource.onerror = function () {
          evtSource.close();
          setTimeout(connectSSE, 3000);
        };
      } else {
        loadFromLocalStorage();
        window.addEventListener('storage', loadFromLocalStorage);
        setInterval(loadFromLocalStorage, 1000);
      }
    }

    function loadFromLocalStorage() {
      try {
        const raw = localStorage.getItem('koth_naruto_state');
        if (raw) render(JSON.parse(raw));
      } catch (e) { }
    }

    // Cloud Realtime Sync (MQTT over WebSockets)
    const urlParams = new URLSearchParams(window.location.search);
    const STREAM_KEY = urlParams.get('room') || urlParams.get('key') || 'hervandisipada';
    const MQTT_TOPIC = `koth/naruto/${STREAM_KEY}`;

    function connectCloudMQTT() {
      if (typeof mqtt === 'undefined') return;
      try {
        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
          clientId: 'ov_' + Math.random().toString(16).substring(2, 8),
          clean: true,
          reconnectPeriod: 2500
        });

        client.on('connect', () => {
          client.subscribe(MQTT_TOPIC, { qos: 0 });
        });

        client.on('message', (topic, payload) => {
          try {
            const data = JSON.parse(payload.toString());
            render(data);
          } catch (err) { }
        });
      } catch (err) { }
    }

    // Initialize
    loadFromLocalStorage();
    connectCloudMQTT();
    connectSSE();
  </script>
</body>

</html>
