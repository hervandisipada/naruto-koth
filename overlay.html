<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KotH Live Overlay - Stream Optimized</title>
  <!-- MQTT.js for Realtime Cloud Sync on GitHub Pages -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --accent-orange: #f97316;
      --accent-gold: #facc15;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --border-glow: rgba(249, 115, 22, 0.7);
      --bg-glass: rgba(10, 15, 29, 0.96);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: transparent;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    /* COMPACT & HIGH-READABILITY MOBILE FRAME */
    .mobile-frame {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 750px;
      background: var(--bg-glass);
      border-radius: 18px;
      padding: 14px 12px;
      border: 2px solid var(--border-glow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), 0 0 20px rgba(249, 115, 22, 0.3);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* HEADER */
    .overlay-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 8px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .overlay-title {
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #f97316, #facc15);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 900;
      color: #ef4444;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: rgba(239, 68, 68, 0.15);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .live-dot span {
      width: 8px;
      height: 8px;
      background-color: #ef4444;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }

    /* ANNOUNCEMENT TICKER */
    .overlay-ticker {
      background: rgba(0, 0, 0, 0.65);
      border-radius: 6px;
      padding: 6px 10px;
      margin-bottom: 8px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      border-left: 3px solid var(--accent-orange);
      color: #f8fafc;
      overflow: hidden;
      flex-shrink: 0;
    }
    .ticker-label {
      color: var(--accent-orange);
      font-weight: 900;
      white-space: nowrap;
    }
    .ticker-content {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fde047;
      font-weight: 700;
    }

    /* MATCH ARENA (1 VS 1) - HIGH CONTRAST & LARGE TEXT */
    .match-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 12px;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .player-slot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .player-slot.king {
      background: linear-gradient(90deg, rgba(234, 179, 8, 0.28) 0%, rgba(15, 23, 42, 0.8) 100%);
      border-left: 5px solid var(--accent-gold);
    }

    .player-slot.king.on-fire {
      background: linear-gradient(90deg, rgba(239, 68, 68, 0.45) 0%, rgba(234, 179, 8, 0.2) 100%);
      border-left: 5px solid #ef4444;
      box-shadow: 0 0 18px rgba(239, 68, 68, 0.6);
    }

    .player-slot.challenger {
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.28) 0%, rgba(15, 23, 42, 0.8) 100%);
      border-left: 5px solid var(--accent-blue);
    }

    /* ROLE BADGE */
    .p-role-tag {
      font-size: 0.72rem;
      font-weight: 900;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 5px;
      display: inline-block;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .king .p-role-tag {
      background-color: var(--accent-gold);
      color: #000;
    }

    .challenger .p-role-tag {
      background-color: var(--accent-blue);
      color: #000;
    }

    /* LARGE PLAYER NAME */
    .p-name {
      font-weight: 900;
      font-size: 1.35rem;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      line-height: 1.2;
    }

    /* LARGE CHARACTER NAME */
    .p-char {
      font-size: 0.95rem;
      color: #fdba74;
      font-weight: 700;
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
      margin-top: 2px;
    }

    .p-right {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    /* PROMINENT WIN STREAK */
    .p-ws {
      font-weight: 900;
      font-size: 1.15rem;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 5px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .free-streak {
      font-size: 0.7rem;
      background: var(--accent-green);
      color: #000;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .fire-badge {
      font-size: 0.7rem;
      background: linear-gradient(90deg, #ef4444, #f97316);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 900;
      animation: pulse 1.2s infinite;
    }

    .p-ticket {
      font-size: 0.88rem;
      color: #cbd5e1;
      font-weight: 600;
    }

    .p-ticket b {
      color: #38bdf8;
      font-size: 1.05rem;
      font-weight: 900;
    }

    .vs-tag {
      text-align: center;
      font-size: 0.85rem;
      font-weight: 900;
      color: var(--accent-red);
      letter-spacing: 3px;
      margin: -2px 0;
      text-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
    }

    /* SCROLLABLE QUEUE SECTION */
    .queue-section {
      background: rgba(0, 0, 0, 0.45);
      border-radius: 12px;
      padding: 10px 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .queue-title {
      font-size: 0.85rem;
      font-weight: 900;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 6px;
    }

    /* SCROLLABLE LIST WITH SLIM SCROLLBAR */
    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      overflow-y: auto;
      flex: 1;
      padding-right: 4px;
      scroll-behavior: smooth;
    }

    .queue-list::-webkit-scrollbar {
      width: 5px;
    }

    .queue-list::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 4px;
    }

    .queue-list::-webkit-scrollbar-thumb {
      background: var(--accent-orange);
      border-radius: 4px;
    }

    /* LARGE & LEGIBLE QUEUE ROWS */
    .queue-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border-left: 4px solid #64748b;
      flex-shrink: 0;
      transition: background 0.2s ease;
    }

    .queue-row.vip {
      border-left-color: var(--accent-gold);
      background: rgba(234, 179, 8, 0.16);
    }

    .queue-row.free {
      border-left-color: var(--accent-blue);
      background: rgba(56, 189, 248, 0.1);
    }

    .q-left {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 290px;
    }

    .q-idx {
      font-weight: 900;
      color: #94a3b8;
      font-size: 0.95rem;
      min-width: 24px;
    }

    .queue-row.vip .q-idx {
      color: var(--accent-gold);
    }

    .queue-row.free .q-idx {
      color: var(--accent-blue);
    }

    .q-name {
      font-weight: 800;
      color: #ffffff;
      font-size: 1.05rem;
    }

    .q-char {
      font-size: 0.88rem;
      color: #fde047;
      font-style: italic;
      font-weight: 600;
    }

    .q-badge {
      font-size: 0.72rem;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 5px;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    .q-badge.vip {
      background-color: var(--accent-gold);
      color: #000;
      box-shadow: 0 0 8px rgba(250, 204, 21, 0.4);
    }

    .q-badge.free {
      background-color: var(--accent-blue);
      color: #000;
    }

    .empty-queue {
      color: #94a3b8;
      font-size: 0.9rem;
      text-align: center;
      padding: 30px 0;
      font-style: italic;
    }

    /* SCROLL HINT BADGE */
    .scroll-hint {
      font-size: 0.72rem;
      color: #94a3b8;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 3px;
    }
  </style>
</head>
<body>

  <div class="mobile-frame">
    <!-- Header -->
    <div class="overlay-header">
      <div class="overlay-title">
        <span>👑 KING OF THE HILL</span>
      </div>
      <div class="live-dot">
        <span></span> LIVE
      </div>
    </div>

    <!-- Announcement Ticker -->
    <div id="overlay-ticker" class="overlay-ticker" style="display:none;">
      <span class="ticker-label">📢</span>
      <span id="ticker-text" class="ticker-content"></span>
    </div>

    <!-- Match Arena (1 VS 1) -->
    <div class="match-box">
      <!-- King Slot -->
      <div class="player-slot king" id="king-slot">
        <div>
          <span class="p-role-tag">👑 KING</span>
          <div id="p1-name" class="p-name">Menunggu...</div>
          <div id="p1-char" class="p-char">-</div>
        </div>
        <div class="p-right">
          <div class="p-ws">
            WS: <span id="p1-ws">0</span>
            <span id="p1-free" class="free-streak" style="display:none;">FREE</span>
            <span id="p1-fire" class="fire-badge" style="display:none;">🔥 ON FIRE</span>
          </div>
          <div class="p-ticket">Tiket: <b id="p1-tickets">0</b></div>
        </div>
      </div>

      <div class="vs-tag">— VS —</div>

      <!-- Challenger Slot -->
      <div class="player-slot challenger">
        <div>
          <span class="p-role-tag">⚔️ PENANTANG</span>
          <div id="p2-name" class="p-name">Menunggu...</div>
          <div id="p2-char" class="p-char">-</div>
        </div>
        <div class="p-right">
          <div class="p-ws">
            WS: <span id="p2-ws">0</span>
            <span id="p2-free" class="free-streak" style="display:none;">FREE</span>
          </div>
          <div class="p-ticket">Tiket: <b id="p2-tickets">0</b></div>
        </div>
      </div>
    </div>

    <!-- Scrollable Queue Section -->
    <div class="queue-section">
      <div class="queue-title">
        <span>📋 ANTREAN</span>
        <div style="display:flex; align-items:center; gap:8px;">
          <span id="queue-scroll-indicator" class="scroll-hint" style="display:none;">↕ Scroll</span>
          <span id="queue-total-count" style="color:var(--accent-orange); font-weight:900; font-size:0.95rem;">0 Pemain</span>
        </div>
      </div>
      
      <!-- ALL QUEUE ITEMS RENDERED HERE WITH SMOOTH SCROLL -->
      <div id="queue-list" class="queue-list">
        <div class="empty-queue">(Antrean Kosong)</div>
      </div>
    </div>
  </div>

  <script>
    let state = {
      p1: null,
      p2: null,
      queue: [],
      saved: [],
      announcement: ''
    };

    function render(data) {
      if (!data) return;
      state = data;

      // Announcement Ticker
      const tickerEl = document.getElementById('overlay-ticker');
      const tickerText = document.getElementById('ticker-text');
      if (state.announcement && state.announcement.trim()) {
        tickerText.innerText = state.announcement.trim();
        tickerEl.style.display = 'flex';
      } else {
        tickerEl.style.display = 'none';
      }

      // P1 (King)
      const p1Name = document.getElementById('p1-name');
      const p1Char = document.getElementById('p1-char');
      const p1Ws = document.getElementById('p1-ws');
      const p1Tickets = document.getElementById('p1-tickets');
      const p1Free = document.getElementById('p1-free');
      const p1Fire = document.getElementById('p1-fire');
      const kingSlot = document.getElementById('king-slot');

      if (state.p1) {
        p1Name.innerText = state.p1.name;
        p1Char.innerText = state.p1.char || 'Belum Pilih / TBA';
        p1Ws.innerText = state.p1.ws || 0;
        p1Tickets.innerText = state.p1.matchesLeft || 0;
        p1Free.style.display = (state.p1.ws >= 1) ? 'inline-block' : 'none';
        
        // Fire streak effect if ws >= 3
        if (state.p1.ws >= 3) {
          kingSlot.classList.add('on-fire');
          p1Fire.style.display = 'inline-block';
        } else {
          kingSlot.classList.remove('on-fire');
          p1Fire.style.display = 'none';
        }
      } else {
        p1Name.innerText = "Menunggu...";
        p1Char.innerText = "-";
        p1Ws.innerText = "0";
        p1Tickets.innerText = "0";
        p1Free.style.display = 'none';
        p1Fire.style.display = 'none';
        kingSlot.classList.remove('on-fire');
      }

      // P2 (Challenger)
      const p2Name = document.getElementById('p2-name');
      const p2Char = document.getElementById('p2-char');
      const p2Ws = document.getElementById('p2-ws');
      const p2Tickets = document.getElementById('p2-tickets');
      const p2Free = document.getElementById('p2-free');

      if (state.p2) {
        p2Name.innerText = state.p2.name;
        p2Char.innerText = state.p2.char || 'Belum Pilih / TBA';
        p2Ws.innerText = state.p2.ws || 0;
        p2Tickets.innerText = state.p2.matchesLeft || 0;
        p2Free.style.display = (state.p2.ws >= 1) ? 'inline-block' : 'none';
      } else {
        p2Name.innerText = "Menunggu...";
        p2Char.innerText = "-";
        p2Ws.innerText = "0";
        p2Tickets.innerText = "0";
        p2Free.style.display = 'none';
      }

      // Queue List (RENDER ALL PLAYERS - SCROLLABLE)
      const qContainer = document.getElementById('queue-list');
      const qTotal = document.getElementById('queue-total-count');
      const scrollHint = document.getElementById('queue-scroll-indicator');
      const qList = state.queue || [];
      qTotal.innerText = `${qList.length} Pemain`;

      if (qList.length === 0) {
        qContainer.innerHTML = '<div class="empty-queue">(Antrean Kosong)</div>';
        scrollHint.style.display = 'none';
      } else {
        qContainer.innerHTML = '';
        scrollHint.style.display = (qList.length > 5) ? 'inline-block' : 'none';

        qList.forEach((p, idx) => {
          const row = document.createElement('div');
          const isVip = p.type === 'VIP';
          row.className = `queue-row ${isVip ? 'vip' : 'free'}`;
          row.innerHTML = `
            <div class="q-left">
              <span class="q-idx">#${idx + 1}</span>
              <span class="q-name">${escapeHtml(p.name)}</span>
              <span class="q-char">(${escapeHtml(p.char || 'TBA')})</span>
            </div>
            <span class="q-badge ${isVip ? 'vip' : 'free'}">${p.type}</span>
          `;
          qContainer.appendChild(row);
        });

        // Trigger smart auto-scroll if content overflows
        startSmartAutoScroll();
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Smart Auto-Scroll for Live Streaming
    let autoScrollTimer = null;
    let isUserInteracting = false;

    function startSmartAutoScroll() {
      const container = document.getElementById('queue-list');
      if (!container) return;

      clearInterval(autoScrollTimer);

      let direction = 1; // 1 = down, -1 = up
      let pauseCount = 0;

      autoScrollTimer = setInterval(() => {
        if (isUserInteracting) return;
        const maxScroll = container.scrollHeight - container.clientHeight;
        if (maxScroll <= 8) return; // Fits on screen, no need to scroll

        if (pauseCount > 0) {
          pauseCount--;
          return;
        }

        if (direction === 1) {
          container.scrollTop += 1;
          if (container.scrollTop >= maxScroll - 2) {
            direction = -1;
            pauseCount = 60; // Pause 3 seconds at bottom
          }
        } else {
          container.scrollTop -= 1.5;
          if (container.scrollTop <= 2) {
            direction = 1;
            pauseCount = 40; // Pause 2 seconds at top
          }
        }
      }, 50);

      // Pause when user touches or hovers
      container.onmouseenter = () => { isUserInteracting = true; };
      container.onmouseleave = () => { isUserInteracting = false; };
      container.ontouchstart = () => { isUserInteracting = true; };
      container.ontouchend = () => { setTimeout(() => { isUserInteracting = false; }, 2000); };
    }

    // Connect Local SSE
    function connectSSE() {
      if (window.location.protocol.startsWith('http')) {
        const evtSource = new EventSource('/api/events');
        evtSource.onmessage = function(e) {
          try {
            render(JSON.parse(e.data));
          } catch(err) {}
        };
        evtSource.onerror = function() {
          evtSource.close();
          setTimeout(connectSSE, 3000);
        };
      } else {
        loadFromLocalStorage();
        window.addEventListener('storage', loadFromLocalStorage);
        setInterval(loadFromLocalStorage, 1000);
      }
    }

    function loadFromLocalStorage() {
      try {
        const raw = localStorage.getItem('koth_naruto_state');
        if (raw) render(JSON.parse(raw));
      } catch(e) {}
    }

    // Cloud Realtime Sync (MQTT over WebSockets)
    const urlParams = new URLSearchParams(window.location.search);
    const STREAM_KEY = urlParams.get('room') || urlParams.get('key') || 'hervandisipada';
    const MQTT_TOPIC = `koth/naruto/${STREAM_KEY}`;

    function connectCloudMQTT() {
      if (typeof mqtt === 'undefined') return;
      try {
        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
          clientId: 'ov_' + Math.random().toString(16).substring(2, 8),
          clean: true,
          reconnectPeriod: 2500
        });

        client.on('connect', () => {
          client.subscribe(MQTT_TOPIC, { qos: 0 });
        });

        client.on('message', (topic, payload) => {
          try {
            const data = JSON.parse(payload.toString());
            render(data);
          } catch(err) {}
        });
      } catch(err) {}
    }

    // Initialize
    connectCloudMQTT();
    connectSSE();
  </script>
</body>
</html>
